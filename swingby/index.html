<!DOCTYPE html>
<html lang="en" class="i18n-wait">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Swingby</title>
  <meta name="theme-color" content="#070B1B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Swingby">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="../analytics.js"></script>
</head>
<body>
  <div id="stage-frame">
  <canvas id="stage"></canvas>
  <div id="vignette"></div>

  <div class="hud">
    <div class="hud-left">
      <button class="icon-btn" id="retry-btn" aria-label="Retry" title="Retry">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button class="icon-btn" id="demo-btn" aria-label="Show me" title="Show me">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="icon-btn" id="exit-btn" style="display:none;" aria-label="Title" title="Title">
        <svg viewBox="0 0 24 24"><path d="M15 6 L9 12 L15 18"/></svg>
      </button>
    </div>
    <div class="hud-right">
      <div class="badge"><span class="label" id="stage-label">STAGE</span><span class="val" id="stage-num">1/6</span></div>
      <div class="badge"><span class="label" id="shots-label">SHOTS</span><span class="val" id="shots-count">0</span></div>
    </div>
    <div id="pace" class="pace" hidden></div>
    <div id="stage-pace" class="pace" hidden></div>
  </div>

  <div id="overlay">
    <img id="title-art" alt="" hidden>
    <div class="title">
      <div class="title-en">SWINGBY</div>
      <div class="title-ja">FLYBY</div>
      <div class="title-divider"></div>
    </div>
    <div class="sub" id="overlay-sub"></div>
    <div id="best-display" style="font-size:.78rem;color:#B8C2D6;margin-top:6px;display:none;">
      <span id="best-pre"></span><span id="best-val" style="color:#FFD178;font-weight:800;">-</span><span id="best-post"></span>
    </div>
    <button class="start-btn" id="start-btn">Start</button>
    <button type="button" id="share-btn" hidden>Xでシェア</button>
    <p id="share-note" class="hint" hidden></p>
    <button type="button" id="watch-btn">Just watch</button>
    <button type="button" id="mute-btn">Sound on</button>
    <button type="button" id="haptic-btn" hidden>Vibrate on</button>
    <div class="hint" id="hint-text"></div>
  </div>

  <div id="result-overlay" class="hidden">
    <div id="result-title"></div>
    <div id="result-sub"></div>
  </div>

  <div id="skip-hint" class="skip-hint" hidden></div>
  <div class="controls" id="controls" style="display:none;">
    <button type="button" class="ctrl-btn" data-input="left" aria-label="Move left">
      <svg viewBox="0 0 24 24"><path d="M15 6 L9 12 L15 18"/></svg>
    </button>
    <button type="button" class="ctrl-btn" data-input="rotL" aria-label="Turn left">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <button type="button" class="fire-btn" id="fire-btn">FIRE</button>
    <button type="button" class="ctrl-btn" data-input="rotR" aria-label="Turn right">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
    <button type="button" class="ctrl-btn" data-input="right" aria-label="Move right">
      <svg viewBox="0 0 24 24"><path d="M9 6 L15 12 L9 18"/></svg>
    </button>
  </div>
  </div>

  <script src="game.js"></script>

</body>
</html>
